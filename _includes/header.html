<header class="site-header">
  <div class="container">
    <div class="header-content">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/research' | relative_url }}" {% if page.url contains '/research' or page.layout == 'research' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/about-team' | relative_url }}" {% if page.url contains '/about-team' %}class="active"{% endif %}>About the Team</a>
        <a href="{{ '/about-esuh' | relative_url }}" {% if page.url contains '/about-esuh' %}class="active"{% endif %}>About ESUH</a>
      </nav>
    </div>
  </div>
</header>
