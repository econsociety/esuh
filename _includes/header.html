<header class="site-header">
  <div class="container">
    <div class="header-content">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/esuh_logo.png' | relative_url }}" alt="ESUH Logo" class="site-logo">
        </a>
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/research' | relative_url }}" {% if page.url contains '/research' or page.layout == 'research' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/working-papers' | relative_url }}" {% if page.url contains '/working-papers' %}class="active"{% endif %}>Working Papers</a>
        <a href="{{ '/about-team' | relative_url }}" {% if page.url contains '/about-team' %}class="active"{% endif %}>About the Team</a>
      </nav>
    </div>
  </div>
</header>
