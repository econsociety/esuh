<header class="site-header">
  <div class="container">
    <div class="header-content">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/esuh_logo.png' | relative_url }}" alt="ESUH Logo" class="site-logo">
        </a>
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <div class="dropdown">
          <a href="{{ '/research' | relative_url }}" {% if page.url contains '/research' or page.layout == 'research' %}class="active"{% endif %}>Research</a>
          <div class="dropdown-content">
            <a href="{{ '/research' | relative_url }}">All Research</a>
            <a href="{{ '/working-papers' | relative_url }}">Working Papers</a>
            <a href="{{ '/research-team' | relative_url }}">About the Research Team</a>
          </div>
        </div>
        <a href="{{ '/team' | relative_url }}" {% if page.url contains '/team' %}class="active"{% endif %}>Team</a>
        <a href="{{ '/events' | relative_url }}" {% if page.url contains '/events' or page.layout == 'event' %}class="active"{% endif %}>Events</a>
      </nav>
    </div>
  </div>
</header>
